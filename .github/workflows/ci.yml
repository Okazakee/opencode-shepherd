name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q cli/src
      - name: Install package (packaging check)
        run: python -m pip install -e cli
      - name: Smoke test entry point
        run: ocshepherd --version
      - name: Unit tests
        run: python -m unittest discover -s cli/tests -v
